[pytest]
testpaths = tests
# `.` on the path so tests can import the flat backend modules (main, models,
# auth, ...) the same way the app does.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    # Third-party deprecations we do not control; our own would still surface.
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:reportlab.*
