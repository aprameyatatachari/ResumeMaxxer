<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Build your vault once. Upload any job description. Get a one-page, ATS-ready resume cut for that exact role - without inventing a single line."
    />
    <title>ResumeMaxxer - Tailor every application</title>
    <script>
      // Set the theme before first paint so night mode never flashes white.
      // Must match lib/theme.ts: 'light' | 'dark' | 'system' (the default).
      ;(function () {
        try {
          var stored = localStorage.getItem('resumemaxxer.theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <!--
      THESIS: a vault of your real record - calm monochrome, one iridescent line where the promise is.
      OWN-WORLD: Conicorn-template language: white and graphite, Geist set huge and tight, pills, fat rounded cards, B&W imagery, one pastel iridescent gradient.
      STORY: the job description is the map - every requirement line is answered by one feature.
      FIRST VIEWPORT: B&W vault door, pill badge, iridescent headline, iridescent-ringed and glass pill CTAs, floating glass nav.
      FORM: numbered sections 001-006; scroll-scrub statement; fact marquee; orb cards; zigzag process; dark proof panel; pricing pair; image CTA.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
